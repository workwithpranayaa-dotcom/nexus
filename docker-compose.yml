services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6380:6379"]
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
